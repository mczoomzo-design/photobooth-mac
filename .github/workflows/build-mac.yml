name: Build macOS app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build DMG (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no Apple cert -> produce an unsigned build
        run: npm run dist

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: photo-booth-mac-dmg
          path: release/*.dmg
          if-no-files-found: error
